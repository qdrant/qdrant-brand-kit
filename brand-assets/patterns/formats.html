<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pattern Formats</title>
  <style>
    :root { --bg: #0b0e1a; --panel: #151a2e; --text: #e8eaf6; --muted: #8b91b3; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; padding: 16px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p { color: var(--muted); margin: 0 0 16px; }
    h2 { font-size: 13px; margin: 24px 0 8px; }
    .row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
    figure { margin: 0; }
    canvas { display: block; border-radius: 4px; background: var(--panel); height: 160px; width: auto; }
    canvas.banner { height: auto; width: 480px; }
    figcaption { color: var(--muted); font-size: 11px; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Pattern formats</h1>
  <p id="status">Rendering…</p>
  <div id="sheet"></div>

  <script type="module">
    import { loadTokens, loadPatterns, isMeshPattern, renderPattern, loadPatternFonts } from "./patterns/index.js";

    // Real output sizes, shown scaled down.
    const formats = [
      { name: "Square 1080", width: 1080, height: 1080 },
      { name: "Portrait 4:5", width: 1080, height: 1350 },
      { name: "Story 9:16", width: 1080, height: 1920 },
      { name: "Landscape 16:9", width: 1920, height: 1080 },
      { name: "Wide banner 3:1", width: 1500, height: 500 },
      { name: "Thin banner 10:1", width: 3000, height: 300 },
    ];

    const tokens = await loadTokens("tokens/placeholder.tokens.json");
    const patterns = await loadPatterns();
    await loadPatternFonts(patterns);
    const sheet = document.getElementById("sheet");
    let done = 0;
    let passed = 0;
    let checks = 0;
    for (const preset of patterns) {
      sheet.insertAdjacentHTML("beforeend", `<h2>${preset.name}</h2><div class="row"></div>`);
      const row = sheet.lastElementChild;
      const options = isMeshPattern(preset)
        ? { mesh: await fetch(`meshes/${preset.examples[0].id}.${preset.meshGroup}.json`).then((r) => r.json()) }
        : { colorway: 0 };
      for (const format of formats) {
        const figure = document.createElement("figure");
        const canvas = document.createElement("canvas");
        if (format.width / format.height >= 3) canvas.className = "banner";
        figure.append(canvas);
        row.append(figure);
        await new Promise((r) => setTimeout(r)); // let the page paint between renders
        const check = renderPattern(canvas, tokens, preset, { ...options, width: format.width, height: format.height });
        if (check) {
          checks++;
          passed += check.pass;
        }
        figure.insertAdjacentHTML("beforeend", `<figcaption>${format.name} · ${format.width} × ${format.height}${check ? (check.pass ? " · pass" : " · FAIL") : ""}</figcaption>`);
        document.getElementById("status").textContent = `Rendering ${++done} of ${patterns.length * formats.length}…`;
      }
    }
    document.getElementById("status").textContent = `${done} renders in ${formats.length} formats. Brand check: ${passed} of ${checks} mesh renders pass.`;
  </script>
</body>
</html>
