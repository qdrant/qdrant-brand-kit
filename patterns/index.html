<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pattern Primitives</title>
  <style>
    :root { --bg: #0b0e1a; --panel: #151a2e; --line: #262c47; --text: #e8eaf6; --muted: #8b91b3; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
    main { display: grid; grid-template-columns: 1fr 1fr 280px; gap: 16px; padding: 16px; }
    figure { margin: 0; }
    figure img, figure canvas { width: 100%; aspect-ratio: 1; display: block; border-radius: 8px; }
    figcaption { color: var(--muted); margin-top: 8px; }
    aside { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 8px; }
    h2:first-child { margin-top: 0; }
    label { display: grid; grid-template-columns: 90px 1fr 44px; align-items: center; gap: 8px; margin: 6px 0; }
    label input { width: 100%; min-width: 0; }
    label span:last-child { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
    code { font-size: 12px; color: #b3b8ff; }
    .token { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; }
    button { margin-top: 16px; width: 100%; padding: 10px; border: 0; border-radius: 6px; background: #6047ff; color: #fff; font: inherit; cursor: pointer; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <figure>
      <img src="reference/luma-background-10.png" alt="Luma-Background-10 exported from Figma" />
      <figcaption>Figma</figcaption>
    </figure>
    <figure>
      <canvas id="canvas"></canvas>
      <figcaption>Code</figcaption>
    </figure>
    <aside id="panel">
      <h2>Tokens (placeholders)</h2>
      <div id="tokens"></div>
      <h2>Refraction</h2>
      <div id="refraction"></div>
      <h2>Noise</h2>
      <div id="noise"></div>
      <button id="download">Download PNG</button>
    </aside>
  </main>

  <script type="module">
    import { loadTokens } from "./patterns/tokens.js";
    import * as pattern from "./patterns/luma-background-10.js";

    const tokens = await loadTokens("tokens/placeholder.tokens.json");
    const params = structuredClone(pattern.defaults);
    const canvas = document.getElementById("canvas");
    const draw = () => pattern.render(canvas, tokens, params);

    const sliders = {
      refraction: { strength: [-100, 100], smoothness: [0, 100], frost: [0, 100], dispersion: [0, 100], r: [2, 100], a: [-180, 180] },
      noise: { size: [1, 12], density: [0, 100] },
    };
    for (const [group, fields] of Object.entries(sliders)) {
      for (const [key, [min, max]] of Object.entries(fields)) {
        const label = document.createElement("label");
        label.innerHTML = `<span>${key}</span><input type="range" min="${min}" max="${max}" value="${params[group][key]}"><span>${params[group][key]}</span>`;
        const [, input, out] = label.children;
        input.addEventListener("input", () => {
          params[group][key] = Number(input.value);
          out.textContent = input.value;
          draw();
        });
        document.getElementById(group).append(label);
      }
    }

    for (const ref of [params.gradient.from, params.gradient.to, params.noise.color]) {
      const path = ref.slice(1, -1);
      const node = path.split(".").reduce((o, k) => o[k], tokens);
      const row = document.createElement("div");
      row.className = "token";
      row.innerHTML = `<code>${path}</code><input type="color" value="${node.$value.slice(0, 7)}">`;
      row.querySelector("input").addEventListener("input", (e) => {
        node.$value = e.target.value.toUpperCase() + node.$value.slice(7);
        draw();
      });
      document.getElementById("tokens").append(row);
    }

    document.getElementById("download").addEventListener("click", () => {
      const link = document.createElement("a");
      link.download = `${pattern.name}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    });

    draw();
  </script>
</body>
</html>
