<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pattern Primitives</title>
  <style>
    :root { --bg: #0b0e1a; --panel: #151a2e; --line: #262c47; --text: #e8eaf6; --muted: #8b91b3; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; height: 100vh; overflow: hidden; }
    /* Everything fits the window: the pattern is as big as the space allows, never bigger. */
    main { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; padding: 16px; height: 100vh; }
    figure { margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; min-height: 0; }
    figure canvas { max-width: 100%; max-height: calc(100vh - 72px); width: auto; height: auto; display: block; border-radius: 8px; }
    figcaption { color: var(--muted); margin-top: 8px; }
    figcaption a { color: #b3b8ff; }
    aside { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; overflow: auto; min-height: 0; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 8px; }
    h2:first-child { margin-top: 0; }
    select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
    .token span { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .token i { width: 16px; height: 16px; border-radius: 4px; display: inline-block; }
    pre { margin: 0; font-size: 11px; color: var(--muted); max-height: 220px; overflow: auto; }
    code { font-size: 12px; color: #b3b8ff; }
    .token { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; }
    .check { margin: 10px 0 0; padding: 8px 10px; border-radius: 6px; font-weight: 600; }
    .check.pass { background: #0f3d2e; color: #7ee2b8; }
    .check.fail { background: #4a1220; color: #ff8792; }
    button { margin-top: 16px; width: 100%; padding: 10px; border: 0; border-radius: 6px; background: #6047ff; color: #fff; font: inherit; cursor: pointer; }
    .size { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center; margin-top: 8px; color: var(--muted); }
    .size input { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
    @media (max-width: 900px) { body { height: auto; overflow: auto; } main { grid-template-columns: 1fr; height: auto; } figure canvas { max-height: none; } }
  </style>
</head>
<body>
  <main>
    <figure>
      <canvas id="canvas"></canvas>
      <figcaption>Code · <a id="figma" target="_blank" rel="noopener">Open the Figma frame</a></figcaption>
    </figure>
    <aside id="panel">
      <h2>Pattern</h2>
      <select id="preset"></select>
      <h2>Size</h2>
      <select id="format"></select>
      <div class="size">
        <input id="width" type="number" min="1" max="8000" value="1080" aria-label="Width in px" />
        <span>×</span>
        <input id="height" type="number" min="1" max="8000" value="1080" aria-label="Height in px" />
      </div>
      <h2 id="option-label">Colorway</h2>
      <select id="colorway"></select>
      <div id="family-row">
        <h2>Color family</h2>
        <select id="family"></select>
      </div>
      <h2>Tokens (placeholders)</h2>
      <div id="tokens"></div>
      <h2>Fixed settings</h2>
      <pre id="settings"></pre>
      <button id="download">Download PNG</button>
    </aside>
  </main>

  <script type="module">
    // Uses only the public entry point, patterns/index.js, the same way a tool would.
    import { loadTokens, resolveToken, loadPatterns, isMeshPattern, isGenerativePattern, choicesFor, renderPattern } from "./patterns/index.js";
    import { colorwayTokens } from "./patterns/tokens.js";

    const tokens = await loadTokens("tokens/placeholder.tokens.json");
    const presets = await loadPatterns();
    const canvas = document.getElementById("canvas");
    const presetSelect = document.getElementById("preset");
    const colorwaySelect = document.getElementById("colorway");
    const familySelect = document.getElementById("family");
    const familyRow = document.getElementById("family-row");
    presets.forEach((preset, i) => presetSelect.add(new Option(preset.name, i)));

    // Any size works. These are shortcuts; type any width and height.
    const formats = [
      ["Square", 1080, 1080],
      ["Portrait 4:5", 1080, 1350],
      ["Story 9:16", 1080, 1920],
      ["Landscape 16:9", 1920, 1080],
      ["Wide banner 3:1", 1500, 500],
      ["Thin banner 10:1", 3000, 300],
      ["Custom", null, null],
    ];
    const formatSelect = document.getElementById("format");
    const widthInput = document.getElementById("width");
    const heightInput = document.getElementById("height");
    formats.forEach(([name, w, h], i) => formatSelect.add(new Option(w ? `${name} · ${w} × ${h}` : name, i)));
    const size = () => ({ width: Math.max(1, Number(widthInput.value) || 1080), height: Math.max(1, Number(heightInput.value) || 1080) });

    let preset, mesh;
    const swatch = (ref) => {
      const hex = resolveToken(tokens, ref);
      return `<div class="token"><code>${ref.slice(1, -1)}</code><span><i style="background:${hex}"></i>${hex}</span></div>`;
    };

    const draw = () => {
      if (isGenerativePattern(preset)) {
        const colorway = Number(colorwaySelect.value || 0);
        renderPattern(canvas, tokens, preset, { colorway, ...size() });
        const look = preset.colorways?.[colorway] ?? preset.settings;
        document.getElementById("tokens").innerHTML = [...look.colors, ...(look.backdrop ?? [])].map((ref) => swatch(ref.token ?? ref)).join("");
        return;
      }
      if (isMeshPattern(preset)) {
        const check = renderPattern(canvas, tokens, preset, { mesh, ...size() });
        document.getElementById("tokens").innerHTML =
          preset.settings.grade.anchors.map(swatch).join("") +
          `<p class="check ${check.pass ? "pass" : "fail"}">Brand check: ${check.pass ? "Pass" : "Fail"} · ${check.offBrand}% off-palette</p>`;
        return;
      }
      const colorway = Number(colorwaySelect.value);
      const family = familyRow.hidden ? undefined : familySelect.value;
      renderPattern(canvas, tokens, preset, { colorway, family, ...size() });
      document.getElementById("tokens").innerHTML = Object.values(colorwayTokens(preset.colorways[colorway], family)).map(swatch).join("");
    };

    // Mesh patterns list example meshes. Color patterns list colorways.
    const chooseOption = async () => {
      if (isGenerativePattern(preset)) {
        familyRow.hidden = true;
        draw();
        return;
      }
      if (isMeshPattern(preset)) {
        const example = preset.examples[colorwaySelect.value];
        familyRow.hidden = true;
        mesh = await fetch(`meshes/${example.id}.${preset.meshGroup}.json`).then((r) => r.json());
        draw();
        return;
      }
      const choice = choicesFor(preset, tokens).colorways[colorwaySelect.value];
      const colorway = preset.colorways[colorwaySelect.value];
      document.getElementById("figma").href = colorway.figma ?? preset.figma ?? "";
      familyRow.hidden = choice.families.length === 0;
      familySelect.innerHTML = "";
      for (const family of choice.families) familySelect.add(new Option(family, family));
      if (choice.defaultFamily) familySelect.value = choice.defaultFamily;
      draw();
    };

    const choosePreset = () => {
      preset = presets[presetSelect.value];
      document.getElementById("settings").textContent = JSON.stringify(preset.settings, null, 2);
      document.getElementById("figma").href = preset.figma ?? "";
      const generative = isGenerativePattern(preset);
      const fixed = generative && !preset.colorways;
      document.getElementById("option-label").hidden = fixed;
      colorwaySelect.hidden = fixed;
      document.getElementById("option-label").textContent = isMeshPattern(preset) ? "Example mesh" : "Colorway";
      colorwaySelect.innerHTML = "";
      if (!fixed) (isMeshPattern(preset) ? preset.examples : preset.colorways).forEach((c, i) => colorwaySelect.add(new Option(c.name, i)));
      chooseOption();
    };

    presetSelect.addEventListener("change", choosePreset);
    colorwaySelect.addEventListener("change", chooseOption);
    familySelect.addEventListener("change", draw);
    formatSelect.addEventListener("change", () => {
      const [, w, h] = formats[formatSelect.value];
      if (!w) return;
      widthInput.value = w;
      heightInput.value = h;
      draw();
    });
    for (const input of [widthInput, heightInput]) {
      input.addEventListener("change", () => {
        formatSelect.value = formats.length - 1; // Custom
        draw();
      });
    }

    document.getElementById("download").addEventListener("click", () => {
      const link = document.createElement("a");
      const parts = [preset.name, colorwaySelect.selectedOptions[0]?.text, `${canvas.width}x${canvas.height}`].filter(Boolean);
      if (!familyRow.hidden) parts.push(familySelect.value);
      link.download = `${parts.join(" - ")}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    });

    choosePreset();
  </script>
</body>
</html>
