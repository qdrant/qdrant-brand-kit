<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pattern Primitives</title>
  <style>
    :root { --bg: #0b0e1a; --panel: #151a2e; --line: #262c47; --text: #e8eaf6; --muted: #8b91b3; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
    main { display: grid; grid-template-columns: 1fr 1fr 280px; gap: 16px; padding: 16px; }
    figure { margin: 0; }
    figure img, figure canvas { width: 100%; aspect-ratio: 1; display: block; border-radius: 8px; }
    figcaption { color: var(--muted); margin-top: 8px; }
    aside { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 8px; }
    h2:first-child { margin-top: 0; }
    select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
    .token span { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .token i { width: 16px; height: 16px; border-radius: 4px; display: inline-block; }
    pre { margin: 0; font-size: 11px; color: var(--muted); max-height: 220px; overflow: auto; }
    code { font-size: 12px; color: #b3b8ff; }
    .token { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; }
    button { margin-top: 16px; width: 100%; padding: 10px; border: 0; border-radius: 6px; background: #6047ff; color: #fff; font: inherit; cursor: pointer; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <figure>
      <img src="reference/luma-background-10.png" alt="Luma-Background-10 exported from Figma" />
      <figcaption>Figma</figcaption>
    </figure>
    <figure>
      <canvas id="canvas"></canvas>
      <figcaption>Code</figcaption>
    </figure>
    <aside id="panel">
      <h2>Color family</h2>
      <select id="family"></select>
      <h2>Tokens (placeholders)</h2>
      <div id="tokens"></div>
      <h2>Fixed settings</h2>
      <pre id="settings"></pre>
      <button id="download">Download PNG</button>
    </aside>
  </main>

  <script type="module">
    import { loadTokens, resolveToken } from "./patterns/tokens.js";
    import * as pattern from "./patterns/luma-background-10.js";

    const tokens = await loadTokens("tokens/placeholder.tokens.json");
    const canvas = document.getElementById("canvas");
    const select = document.getElementById("family");

    // Any family that has the 300 and 500 steps can be used.
    for (const [family, steps] of Object.entries(tokens.color)) {
      if (["300", "500"].every((step) => steps[step])) select.add(new Option(family, family));
    }
    select.value = pattern.defaultFamily;

    const draw = () => {
      pattern.render(canvas, tokens, select.value);
      document.getElementById("tokens").innerHTML = Object.values(pattern.colors(select.value))
        .map((ref) => {
          const path = ref.slice(1, -1);
          const hex = resolveToken(tokens, ref);
          return `<div class="token"><code>${path}</code><span><i style="background:${hex}"></i>${hex}</span></div>`;
        })
        .join("");
    };
    select.addEventListener("change", draw);
    document.getElementById("settings").textContent = JSON.stringify(pattern.settings, null, 2);

    document.getElementById("download").addEventListener("click", () => {
      const link = document.createElement("a");
      link.download = `${pattern.name}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    });

    draw();
  </script>
</body>
</html>
