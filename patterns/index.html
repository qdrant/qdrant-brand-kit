<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pattern Primitives</title>
  <style>
    :root { --bg: #0b0e1a; --panel: #151a2e; --line: #262c47; --text: #e8eaf6; --muted: #8b91b3; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
    main { display: grid; grid-template-columns: 1fr 1fr 280px; gap: 16px; padding: 16px; }
    figure { margin: 0; }
    figure img, figure canvas { width: 100%; aspect-ratio: 1; display: block; border-radius: 8px; }
    figcaption { color: var(--muted); margin-top: 8px; }
    aside { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 8px; }
    h2:first-child { margin-top: 0; }
    select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
    .token span { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .token i { width: 16px; height: 16px; border-radius: 4px; display: inline-block; }
    pre { margin: 0; font-size: 11px; color: var(--muted); max-height: 220px; overflow: auto; }
    code { font-size: 12px; color: #b3b8ff; }
    .token { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; }
    .check { margin: 10px 0 0; padding: 8px 10px; border-radius: 6px; font-weight: 600; }
    .check.pass { background: #0f3d2e; color: #7ee2b8; }
    .check.fail { background: #4a1220; color: #ff8792; }
    button { margin-top: 16px; width: 100%; padding: 10px; border: 0; border-radius: 6px; background: #6047ff; color: #fff; font: inherit; cursor: pointer; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <figure>
      <img id="reference" alt="Figma export of the selected pattern" />
      <figcaption>Figma</figcaption>
    </figure>
    <figure>
      <canvas id="canvas"></canvas>
      <figcaption>Code</figcaption>
    </figure>
    <aside id="panel">
      <h2>Pattern</h2>
      <select id="preset"></select>
      <h2 id="option-label">Colorway</h2>
      <select id="colorway"></select>
      <div id="family-row">
        <h2>Color family</h2>
        <select id="family"></select>
      </div>
      <h2>Tokens (placeholders)</h2>
      <div id="tokens"></div>
      <h2>Fixed settings</h2>
      <pre id="settings"></pre>
      <button id="download">Download PNG</button>
    </aside>
  </main>

  <script type="module">
    import { loadTokens, resolveToken, colorwayTokens, familiesFor } from "./patterns/tokens.js";
    import { loadAllPresets } from "./patterns/presets.js";

    const tokens = await loadTokens("tokens/placeholder.tokens.json");
    const presets = await loadAllPresets();
    const canvas = document.getElementById("canvas");
    const presetSelect = document.getElementById("preset");
    const colorwaySelect = document.getElementById("colorway");
    const familySelect = document.getElementById("family");
    presets.forEach((preset, i) => presetSelect.add(new Option(preset.name, i)));

    let preset, recipe, colorway, sourceImage;
    const loadImage = (url) => new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = url;
    });

    const draw = () => {
      if (sourceImage) {
        const check = recipe.render(canvas, tokens, preset, sourceImage);
        const anchors = preset.settings.grade.anchors.map((ref) => {
          const hex = resolveToken(tokens, ref);
          return `<div class="token"><code>${ref.slice(1, -1)}</code><span><i style="background:${hex}"></i>${hex}</span></div>`;
        });
        document.getElementById("tokens").innerHTML =
          anchors.join("") +
          `<p class="check ${check.pass ? "pass" : "fail"}">Brand check: ${check.pass ? "Pass" : "Fail"} · ${check.offBrand}% off-palette</p>`;
        return;
      }
      const color = colorwayTokens(colorway, familySelect.value);
      recipe.render(canvas, tokens, preset, color);
      document.getElementById("tokens").innerHTML = Object.values(color)
        .map((ref) => {
          const hex = resolveToken(tokens, ref);
          return `<div class="token"><code>${ref.slice(1, -1)}</code><span><i style="background:${hex}"></i>${hex}</span></div>`;
        })
        .join("");
    };

    // Image presets list source images. Gradient presets list colorways.
    const chooseColorway = async () => {
      const familyRow = document.getElementById("family-row");
      if (preset.examples) {
        const source = preset.examples[colorwaySelect.value];
        familyRow.hidden = true;
        document.getElementById("reference").src = preset.reference;
        sourceImage = await loadImage(source.image);
        draw();
        return;
      }
      sourceImage = null;
      colorway = preset.colorways[colorwaySelect.value];
      document.getElementById("reference").src = colorway.reference ?? "";

      // Only colorways with {family} in them let you pick a family.
      const usesFamily = colorway.from.includes("{family}") || colorway.to.includes("{family}");
      familyRow.hidden = !usesFamily;
      familySelect.innerHTML = "";
      for (const family of familiesFor(tokens, colorway)) familySelect.add(new Option(family, family));
      if (colorway.defaultFamily) familySelect.value = colorway.defaultFamily;
      draw();
    };

    const choosePreset = async () => {
      preset = presets[presetSelect.value];
      recipe = await import(`./patterns/${preset.recipe}.js`);
      document.getElementById("settings").textContent = JSON.stringify(preset.settings, null, 2);
      document.getElementById("option-label").textContent = preset.examples ? "Source image" : "Colorway";
      colorwaySelect.innerHTML = "";
      (preset.examples ?? preset.colorways).forEach((c, i) => colorwaySelect.add(new Option(c.name, i)));
      chooseColorway();
    };

    presetSelect.addEventListener("change", choosePreset);
    colorwaySelect.addEventListener("change", chooseColorway);
    familySelect.addEventListener("change", draw);

    document.getElementById("download").addEventListener("click", () => {
      const link = document.createElement("a");
      const option = colorwaySelect.selectedOptions[0].text;
      link.download = `${preset.name} - ${sourceImage ? option : familySelect.value + " " + option}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    });

    choosePreset();
  </script>
</body>
</html>
