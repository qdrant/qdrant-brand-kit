# The code packages. Everything else in the repo (primitives, guidelines, brand assets,
# brand components, review) is plain files, not part of the workspace. The mascot scripts
# in brand-assets/mascot keep their own package.json and aren't listed here on purpose.
packages:
  - "design-system"
  - "web"
  - "studio"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  msw: false

# Security fixes for dependencies we don't pin ourselves (2026-11-23). minimatch below 11.0.1 has a denial-of-service
# bug (GHSA-g3hv-75wg-m249); ESLint and ts-morph (through the shadcn CLI) still ask for ^10, and their newer versions
# have moved to ^11. Remove this once they're upgraded.
overrides:
  "minimatch@>=7.0.0 <11.0.1": "^11.0.5"
